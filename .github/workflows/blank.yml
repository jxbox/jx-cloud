# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Terraform repo 
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.10.0'
      - name: find script 
        id: find-firs
        run: |
          echo "dirs=$(find envs -type f -name '*.tf' -exec firname {} \; | sort -u | paste -sd ',' -)" >> $GITHUB_OUTPUT


      - name: Run each folder
        run: |
          # 查找所有包含 .tf 文件的目录
          dirs=$(find . -type f -name "*.tf" -exec dirname {} \; | sort -u)
          for dir in $dirs; do
            echo "Running Terraform in $dir"
            cd $dir
            ls
            cd -
          done 
              
      - name: Terraform start v3
        run:  terraform init 

      - name: Terraform  echeck 
        run:  ls
      # Runs a set of commands using the runners shell
      - name: Terraform plan 
        run: |
          terraform  plan

      - name: Terrafoem apply
        run: terraform apply --auto-approve
        env:
          TF_VAR_access_key: ${{ secrets.MY_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.MY_ACCESS_SK }}
